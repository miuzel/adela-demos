<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="adela-demos 是面向小学生的公益开源互动课件集合，将持续新增课件">
  <title>adela-demos · 小学生互动课件集合</title>
  <style>
    :root{--ink:#17233d;--muted:#60708f;--blue:#4169e1;--violet:#7b61d9;--mint:#21b89a;--bg:#f5f7ff;--card:#fff;--line:#e5e9f5;--shadow:0 18px 50px rgba(39,56,115,.12);--radius-md:16px;--radius-lg:24px}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 80% 0,#e8e7ff 0,transparent 36%),var(--bg);line-height:1.7}
    .wrap{width:min(1100px,calc(100% - 36px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:28px 0}.brand{display:flex;gap:12px;align-items:center;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));font-size:22px}.tag{color:var(--blue);font-size:12px;letter-spacing:.14em;font-weight:800}.top a{color:var(--muted);text-decoration:none;font-size:14px}.hero{padding:70px 0 62px;max-width:760px}.hero h1{font-size:clamp(38px,7vw,72px);line-height:1.12;letter-spacing:-.05em;margin:14px 0 20px}.hero h1 em{font-style:normal;color:var(--blue)}.hero p{color:var(--muted);font-size:18px;max-width:620px}.badge{display:inline-block;border:1px solid #cdd5ff;border-radius:99px;padding:5px 13px;color:var(--violet);background:#fff;font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:end;margin:12px 0 20px}.section-title h2{font-size:25px;margin:0}.section-title span{font-size:13px;color:var(--muted)}.catalog-tools{display:flex;align-items:center;gap:14px;margin-bottom:22px}.search-box{flex:1;min-height:48px;border:1px solid var(--line);border-radius:var(--radius-md);padding:10px 15px;background:var(--card);color:var(--ink);font:inherit;outline:none}.search-box:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(65,105,225,.15)}.result-count{color:var(--muted);font-size:14px;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:290px}.icon{font-size:38px}.card h3{font-size:23px;margin:13px 0 7px}.card p{color:var(--muted);margin:0 0 25px}.go{margin-top:auto;align-self:flex-start;background:var(--ink);color:#fff;text-decoration:none;border-radius:12px;padding:10px 17px;font-weight:700}.go:hover{background:var(--blue)}.empty-state{grid-column:1/-1;padding:40px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--radius-lg)}.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin:26px 0 0}.page-btn{min-width:48px;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.page-btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}.page-btn:disabled{opacity:.45;cursor:not-allowed}.page-info{color:var(--muted);font-size:14px;min-width:92px;text-align:center}.note{margin:58px 0 30px;padding:22px 25px;border-radius:18px;background:#e9fff8;color:#176d5d}.footer{padding:34px 0;color:var(--muted);font-size:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
    @media(max-width:680px){.wrap{width:min(100% - 28px,1100px)}.top{padding:18px 0}.top a{display:none}.hero{padding:46px 0 42px}.hero p{font-size:16px}.cards{grid-template-columns:1fr}.card{min-height:250px;padding:23px}.section-title{display:block}.section-title span{display:block;margin-top:5px}.catalog-tools{display:block}.search-box{width:100%}.result-count{display:block;margin-top:8px}.pagination{gap:8px}.footer{display:block}.footer span{display:block;margin:4px 0}}
  </style>
</head>
<body><div class="wrap"><header class="top"><div class="brand"><span class="mark">↗</span><span>adela-demos</span></div><a href="https://miuzel.github.io/adela-demos/">公益开源 · 免费使用</a></header>
  <main><section class="hero"><span class="badge">ADELA-DEMOS · OPEN LESSONS</span><h1>adela-demos<br><em>小学生课件集合</em></h1><p>这是一个会持续新增的小课件集合，把“换个参照物看运动”变成一场好玩的探索。持续增长，公益开源，欢迎老师、家长和孩子一起使用。</p></section>
  <section><div class="section-title"><h2>选择一间实验室</h2><span>无需安装，打开就能体验</span></div><div class="catalog-tools"><input class="search-box" id="demoSearch" type="search" placeholder="搜索课件，如：伽利略 / 相对速度" aria-label="搜索课件"><span class="result-count" id="resultCount" aria-live="polite"></span></div><div class="cards" id="demoCards"></div><nav class="pagination" aria-label="课件分页"><button class="page-btn" id="prevPage" type="button">上一页</button><span class="page-info" id="pageInfo" aria-live="polite"></span><button class="page-btn" id="nextPage" type="button">下一页</button></nav></section><p class="note">💡 小提示：先从动画小课堂建立直觉，再到实验室自己调节速度，发现规律！</p></main>
  <footer class="footer"><span>adela-demos · 公益开源，让每个孩子都能接近有趣的科学。</span><span>MIT License · miuzel</span></footer></div><script>
    const demos = [
      {icon:'🚗', title:'伽利略变换实验室', desc:'拖动小车速度、切换观察视角，观察同一个运动如何“换个角度”呈现。', href:'demos/galileo-lab/index.html'},
      {icon:'🎬', title:'相对速度小课堂', desc:'用动画和生活故事认识相对速度、相遇与追及，边看边答题巩固理解。', href:'demos/relative-velocity/index.html'}
    ];
    const pageSize = 6;
    let currentPage = 1;
    let filteredDemos = demos;
    const cards = document.querySelector('#demoCards');
    const search = document.querySelector('#demoSearch');
    const resultCount = document.querySelector('#resultCount');
    const pageInfo = document.querySelector('#pageInfo');
    const prevPage = document.querySelector('#prevPage');
    const nextPage = document.querySelector('#nextPage');
    function renderDemos(){
      const totalPages = Math.max(1, Math.ceil(filteredDemos.length / pageSize));
      currentPage = Math.min(currentPage, totalPages);
      const start = (currentPage - 1) * pageSize;
      const visible = filteredDemos.slice(start, start + pageSize);
      cards.innerHTML = visible.length ? visible.map(demo => `<article class="card"><div class="icon">${demo.icon}</div><h3>${demo.title}</h3><p>${demo.desc}</p><a class="go" href="${demo.href}">开始体验　→</a></article>`).join('') : '<div class="empty-state">没有找到匹配的课件，试试其他关键词吧。</div>';
      resultCount.textContent = `共 ${filteredDemos.length} 个课件`;
      pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
      prevPage.disabled = currentPage === 1;
      nextPage.disabled = currentPage === totalPages;
    }
    search.addEventListener('input', () => {
      const keyword = search.value.trim().toLowerCase();
      filteredDemos = demos.filter(demo => `${demo.title} ${demo.desc}`.toLowerCase().includes(keyword));
      currentPage = 1;
      renderDemos();
    });
    prevPage.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderDemos(); } });
    nextPage.addEventListener('click', () => { if (currentPage < Math.ceil(filteredDemos.length / pageSize)) { currentPage++; renderDemos(); } });
    renderDemos();
  </script></body></html>
