<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽屉原理 · 鸽巢大挑战</title><style>
:root{--ink:#17233d;--muted:#60708f;--primary:#4169e1;--accent:#7b61d9;--success:#21b89a;--warning:#f2a33a;--danger:#e76886;--bg:#f5f7ff;--surface:#fff;--shadow:0 18px 50px rgba(39,56,115,.12);--font:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6}header{max-width:1080px;margin:auto;padding:20px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:clamp(22px,4vw,32px)}header p{margin:3px 0;color:var(--muted)}button{border:0;border-radius:12px;padding:11px 16px;min-height:44px;cursor:pointer;font:inherit;font-weight:700;color:#fff;background:var(--primary);transition:.24s}button:hover{transform:translateY(-2px)}button:focus-visible,input:focus-visible{outline:3px solid #9bb0ff;outline-offset:2px}.reset{color:var(--primary);background:transparent;border:1px solid #b9c6ee}.wrap{max-width:1080px;margin:auto;padding:0 20px 48px}.hero{padding:28px;border-radius:24px;background:linear-gradient(135deg,#21b89a,#4169e1);color:#fff;box-shadow:var(--shadow);margin-bottom:20px}.hero h2{margin:0 0 8px;font-size:clamp(21px,4vw,30px)}.hero p{margin:0}.grid{display:grid;grid-template-columns:300px 1fr;gap:20px}.card{background:var(--surface);padding:20px;border-radius:16px;box-shadow:var(--shadow)}.card h3{margin:0 0 14px}.field{margin:15px 0}.field label{display:flex;justify-content:space-between;font-weight:700}.field input{width:100%;accent-color:var(--primary)}.value{font-size:20px;color:var(--primary)}.hint{font-size:13px;color:var(--muted)}.modes{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.modes button{background:#edf1ff;color:var(--primary)}.modes button.active{background:var(--primary);color:#fff}.status{min-height:50px;padding:10px 14px;border-radius:10px;background:#eefaf7;color:#08775e;font-weight:700}.drawers{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-top:18px;align-items:end}.drawer{min-height:165px;padding:10px 8px 8px;border:3px solid #b9c6ee;border-bottom:10px solid #7e91c8;border-radius:12px 12px 8px 8px;background:#f7f8ff;display:flex;flex-direction:column;justify-content:flex-end;transition:.3s}.drawer.hot{border-color:var(--success);background:#e4fff7;box-shadow:0 0 0 4px #b8f1df}.drawer h4{text-align:center;margin:0 0 auto;color:var(--muted)}.balls{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-end}.ball{width:22px;height:22px;border-radius:50%;background:#f2a33a;border:2px solid #cf7b19;display:block}.legend{font-size:13px;color:var(--muted);margin-top:12px}.formula{margin-top:18px;background:#fff8e8;border-left:4px solid var(--warning);padding:12px;border-radius:8px;font-weight:700}.manual{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:15px}.manual select{min-height:44px;border:1px solid #b9c6ee;border-radius:10px;padding:8px;font:inherit}.manual button{background:var(--accent)}@media(max-width:720px){header{align-items:flex-start;gap:10px}.grid{grid-template-columns:1fr}.drawer{min-height:145px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><header><div><h1>🕊️ 抽屉原理</h1><p>鸽巢大挑战：总有一个抽屉会“挤爆”</p></div><button class="reset" id="reset">↺ 重置</button></header><main class="wrap"><section class="hero"><h2>小球比抽屉多？必有一个更热闹！</h2><p>把 n 个小球放进 k 个抽屉，不管怎么分，至少有一个抽屉装下 ⌈n ÷ k⌉ 个小球。</p></section><div class="grid"><section class="card"><h3>🎛️ 设置挑战</h3><div class="field"><label for="n">物体数 n <output id="nOut" class="value">14</output> 个</label><input id="n" type="range" min="1" max="40" value="14"></div><div class="field"><label for="k">抽屉数 k <output id="kOut" class="value">4</output> 个</label><input id="k" type="range" min="1" max="10" value="4"></div><p class="hint">橙色小球代表物体，绿色发光抽屉就是被鸽巢原理找出的“至少这么多”！</p><div class="modes"><button class="active" data-mode="worst">😈 最不利分配</button><button data-mode="manual">🖐️ 手动投放</button></div><div class="manual" id="manual"><label for="target">投进</label><select id="target"></select><button id="drop">放入一个小球</button></div><div class="status" id="status" role="status"></div><div class="formula" id="formula"></div></section><section class="card"><h3>🗄️ 抽屉现场</h3><div class="drawers" id="drawers"></div><p class="legend">⭐ 高亮抽屉：里面至少有 ⌈n ÷ k⌉ 个物体。把小球挪来挪去，结论依然成立！</p></section></div></main><script>
const $=s=>document.querySelector(s);let mode='worst',counts=[],dropped=0;const n=$('#n'),k=$('#k');
function ceil(){return Math.ceil(+n.value/+k.value)}
function worstCounts(){const N=+n.value,K=+k.value;return Array.from({length:K},(_,i)=>Math.floor(N/K)+(i<N%K?1:0))}
function render(){const N=+n.value,K=+k.value;$('#nOut').textContent=N;$('#kOut').textContent=K;if(counts.length!==K)counts=mode==='worst'?worstCounts():Array(K).fill(0);const need=ceil(),ds=$('#drawers');ds.innerHTML='';counts.forEach((c,i)=>{const d=document.createElement('div');d.className='drawer'+(c>=need?' hot':'');d.innerHTML=`<h4>抽屉 ${i+1}<br><strong>${c}</strong> 个</h4><div class="balls">${'<i class="ball"></i>'.repeat(c)}</div>`;ds.append(d)});$('#target').innerHTML=counts.map((_,i)=>`<option value="${i}">抽屉 ${i+1}</option>`).join('');$('#formula').textContent=`⌈${N} ÷ ${K}⌉ = ${need}：至少有一个抽屉装着 ${need} 个物体。`;$('#status').textContent=mode==='worst'?`最不利分配完成！最少也有一个抽屉达到 ${need} 个。`:`已投放 ${dropped}/${N} 个，还能继续调整分配。`}
function chooseMode(e){mode=e.currentTarget.dataset.mode;document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('active',b===e.currentTarget));dropped=0;counts=Array(+k.value).fill(0);render();if(mode==='worst'){const target=worstCounts();let i=0;const timer=setInterval(()=>{if(i>=target.length){clearInterval(timer);return}counts[i]++;if(counts[i]>=target[i])i++;render()},180)}}
[n,k].forEach(x=>x.addEventListener('input',()=>{dropped=0;counts=mode==='worst'?worstCounts():Array(+k.value).fill(0);render()}));document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',chooseMode));$('#drop').addEventListener('click',()=>{if(mode!=='manual')return;const N=+n.value;if(dropped>=N){$('#status').textContent='小球用光啦！看看哪些抽屉被高亮。';return}counts[+$('select').value]++;dropped++;render()});$('#reset').addEventListener('click',()=>{n.value=14;k.value=4;mode='worst';dropped=0;document.querySelectorAll('.modes button').forEach((b,i)=>b.classList.toggle('active',i===0));render()});render();
</script></body></html>
