<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流水行船 · 行程问题</title><style>
:root{--ink:#17233d;--muted:#60708f;--blue:#4169e1;--violet:#7b61d9;--mint:#21b89a;--orange:#f2a33a;--bg:#f5f7ff;--card:#fff;--line:#e5e9f5;--shadow:0 18px 50px #2738731f;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#e8e7ff,transparent 35%),var(--bg);color:var(--ink);line-height:1.6}.wrap{width:min(1000px,calc(100% - 28px));margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}h1{font-size:clamp(25px,5vw,42px);margin:24px 0 4px;line-height:1.2}header a{color:var(--muted);text-decoration:none}.lead{color:var(--muted);margin:0 0 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,28px);box-shadow:var(--shadow);margin:18px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.actions button{min-height:46px;padding:9px 17px;border:1px solid #cbd4f4;border-radius:12px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}.tabs button[aria-selected=true],.actions .primary{background:var(--blue);border-color:var(--blue);color:#fff}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.control label{display:flex;justify-content:space-between;font-weight:700}.control output{color:var(--blue)}input[type=range]{width:100%;accent-color:var(--blue);min-height:44px}.canvas-wrap{position:relative;margin-top:18px;border-radius:15px;overflow:hidden;background:#dff5ff}.canvas-wrap canvas{display:block;width:100%;height:auto}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:10px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px}.formula{font-size:clamp(17px,3vw,23px);font-weight:800;color:var(--violet);text-align:center;margin:16px 0}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact{background:#f5f7ff;border-radius:13px;padding:10px;text-align:center}.fact b{display:block;font-size:20px;color:var(--blue)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hint{color:var(--muted);font-size:14px}.mode-panel{display:none}.mode-panel.active{display:block}@media(max-width:600px){.controls,.facts{grid-template-columns:1fr}.wrap{width:min(100% - 20px,1000px)}header a{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="wrap"><header><strong>🛶 行程问题 · 流水行船</strong><a href="../../index.html">返回课件集</a></header><main><h1>船怎样“借”水前进？</h1><p class="lead">先看岸上的速度，再换到水的参照系，发现速度加减背后的道理。</p><nav class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="sail">顺流与逆流</button><button role="tab" aria-selected="false" data-tab="rescue">救生圈相遇</button></nav><section id="sail" class="card mode-panel active" role="tabpanel"><div class="controls"><div class="control"><label for="boat">静水船速 <output id="boatOut">5 m/s</output></label><input id="boat" type="range" min="1" max="10" value="5"></div><div class="control"><label for="water">水流速 <output id="waterOut">2 m/s</output></label><input id="water" type="range" min="0" max="6" value="2"></div></div><div class="canvas-wrap"><canvas id="sailCanvas" width="900" height="300" aria-label="顺流逆流速度动画"></canvas></div><div class="legend"><span><i class="dot" style="background:#4169e1"></i>船相对岸</span><span><i class="dot" style="background:#21b89a"></i>水流/漂浮物</span><span><i class="dot" style="background:#7b61d9"></i>船相对水</span></div><div class="facts"><div class="fact">顺流 <b id="down">7 m/s</b></div><div class="fact">逆流 <b id="up">3 m/s</b></div><div class="fact">漂浮物相对水 <b>0 m/s</b></div></div><p class="formula">v顺 = v船 + v水　｜　v逆 = v船 − v水</p><p class="hint">紫色箭头表示船在水中的划行速度；绿色小圆点随水流移动。调节滑块，观察岸上速度如何变化。</p><div class="actions"><button class="primary" id="play" type="button">▶ 播放</button><button id="reset" type="button">↺ 重置</button></div></section><section id="rescue" class="card mode-panel" role="tabpanel"><div class="controls"><div class="control"><label for="gap">两船初距 <output id="gapOut">180 m</output></label><input id="gap" type="range" min="100" max="260" value="180"></div><div class="control"><label for="speed">静水相向速度 <output id="speedOut">4 m/s</output></label><input id="speed" type="range" min="1" max="8" value="4"></div></div><div class="canvas-wrap"><canvas id="rescueCanvas" width="900" height="300" aria-label="救生圈漂流两船相遇动画"></canvas></div><div class="facts"><div class="fact">相遇时间 <b id="meetTime">22.5 s</b></div><div class="fact">水流参照系 <b>距离不变</b></div><div class="fact">救生圈对水 <b>0 m/s</b></div></div><p class="formula">相遇时间 = 距离 ÷（v甲 + v乙）</p><p class="hint">绿色救生圈和水一起漂移；切换“水的参照系”后，救生圈静止，两船仍以相同相对速度相遇——这就是静水等价。</p><div class="actions"><button class="primary" id="rescuePlay" type="button">▶ 播放</button><button id="rescueReset" type="button">↺ 重置</button></div></section></main></div><script>
const $=s=>document.querySelector(s), sail=$('#sailCanvas'), sc=sail.getContext('2d'), rc=$('#rescueCanvas'), rr=rc.getContext('2d');let running=false,t=0,rt=0,last=0;
function line(c,x1,y1,x2,y2,color,w=3){c.strokeStyle=color;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}function arrow(c,x,y,dx,color,label){line(c,x,y,x+dx,y,color,4);c.fillStyle=color;c.beginPath();c.moveTo(x+dx,y);c.lineTo(x+dx-(dx>0?10:-10),y-7);c.lineTo(x+dx-(dx>0?10:-10),y+7);c.fill();c.font='bold 14px system-ui';c.fillText(label,x+dx/2-20,y-10)}
function drawSail(){let w=sail.width,h=sail.height,boat=+$('#boat').value,water=+$('#water').value;sc.clearRect(0,0,w,h);sc.fillStyle='#dff5ff';sc.fillRect(0,0,w,h);line(sc,50,145,w-50,145,'#99b9c8',2);sc.fillStyle='#60708f';sc.font='14px system-ui';sc.fillText('岸（向右为正）',55,35);sc.fillText('水流 →',55,185);for(let x=70+(t*water*3)%80;x<w;x+=80){sc.fillStyle='#21b89a';sc.beginPath();sc.arc(x,205,5,0,7);sc.fill()}let bx=130+(t*boat*5)%620;sc.fillStyle='#4169e1';sc.fillRect(bx,118,65,27);sc.fillStyle='#17233d';sc.beginPath();sc.moveTo(bx+65,118);sc.lineTo(bx+82,131);sc.lineTo(bx+65,145);sc.fill();sc.fillText('船',bx+22,108);arrow(sc,bx+25,80,Math.max(24,boat*8),'#7b61d9','v船');arrow(sc,bx+25,165,Math.max(20,water*8),'#21b89a','v水');arrow(sc,bx+100,240,Math.max(24,(boat+water)*8),'#4169e1','顺流');arrow(sc,bx+100,270,-Math.max(20,(boat-water)*8),'#f2a33a','逆流');$('#boatOut').textContent=boat+' m/s';$('#waterOut').textContent=water+' m/s';$('#down').textContent=boat+water+' m/s';$('#up').textContent=boat-water+' m/s'}
function drawRescue(){let w=rc.width,h=rc.height,gap=+$('#gap').value,s=+$('#speed').value;rr.clearRect(0,0,w,h);rr.fillStyle='#dff5ff';rr.fillRect(0,0,w,h);line(rr,55,150,w-55,150,'#99b9c8',3);rr.font='14px system-ui';rr.fillStyle='#60708f';rr.fillText('岸上参照系：水流 →，救生圈随水漂移',60,35);let meet=Math.max(1,gap/(2*s)),p=Math.min(rt/meet,1),left=100+p*300,right=800-p*300,ring=450+Math.min(rt,meet)*2.5;rr.fillStyle='#4169e1';rr.fillRect(left-30,130,60,30);rr.fillStyle='#e76886';rr.fillRect(right-30,130,60,30);rr.fillStyle='#21b89a';rr.beginPath();rr.arc(ring,100,13,0,7);rr.strokeStyle='#21b89a';rr.lineWidth=6;rr.stroke();rr.fillStyle='#17233d';rr.fillText('甲船',left-20,185);rr.fillText('乙船',right-20,185);rr.fillText('救生圈',ring-24,78);line(rr,450,220,450+(ring-450),220,'#21b89a',3);rr.fillText('水的参照系：救生圈静止，两船相向',60,265);$('#gapOut').textContent=gap+' m';$('#speedOut').textContent=s+' m/s';$('#meetTime').textContent=(meet).toFixed(1)+' s'}
function frame(now){if(!last)last=now;let d=Math.min((now-last)/1000,.05);last=now;if(running){t+=d;rt+=d}drawSail();drawRescue();if(running)requestAnimationFrame(frame)}
['boat','water','gap','speed'].forEach(id=>$('#'+id).addEventListener('input',()=>{drawSail();drawRescue()}));$('#play').onclick=()=>{running=!running;$('#play').textContent=running?'Ⅱ 暂停':'▶ 播放';if(running){last=0;requestAnimationFrame(frame)}};$('#reset').onclick=()=>{t=0;running=false;$('#boat').value=5;$('#water').value=2;$('#play').textContent='▶ 播放';drawSail()};$('#rescuePlay').onclick=()=>{running=!running;$('#rescuePlay').textContent=running?'Ⅱ 暂停':'▶ 播放';if(running){last=0;requestAnimationFrame(frame)}};$('#rescueReset').onclick=()=>{rt=0;running=false;$('#rescuePlay').textContent='▶ 播放';drawRescue()};document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.mode-panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));});drawSail();drawRescue();
</script></body></html>
