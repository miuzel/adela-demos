<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>等积变形｜平行线间的三角形</title>
<style>
:root{--ink:#17233d;--muted:#60708f;--primary:#4169e1;--accent:#7b61d9;--success:#21b89a;--bg:#f5f7ff;--surface:#fff;--r:16px;--shadow:0 18px 50px #2738731f;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{max-width:1100px;margin:auto;padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(22px,4vw,34px);margin:0}h1 small{display:block;color:var(--primary);font-size:13px;letter-spacing:2px;margin-bottom:6px}button{min-height:44px;border:0;border-radius:10px;padding:10px 16px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e9edff;color:var(--primary)}button:focus-visible{outline:3px solid #f2a33a;outline-offset:2px}.wrap{max-width:1100px;margin:auto;padding:12px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}canvas{width:100%;height:auto;display:block;border-radius:12px;background:#fbfcff;touch-action:none}.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:13px;margin-top:12px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}.control{margin:18px 0}.control label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}.value{color:var(--primary)}input[type=range]{width:100%;accent-color:var(--primary)}.formula{background:#f0f4ff;border-radius:12px;padding:14px;font-size:17px;line-height:1.8}.formula strong{color:var(--success)}.hint{color:var(--muted);line-height:1.6;font-size:14px}.switch{display:flex;align-items:center;gap:9px;margin:14px 0;color:var(--ink)}@media(max-width:760px){header{padding-top:18px}.wrap{grid-template-columns:1fr;padding:8px 12px 28px}header{padding-left:14px;padding-right:14px}.card{padding:13px}}
</style></head><body><header><h1><small>几何模型 · 01</small>平行线间的等积变形</h1><button id="reset" class="secondary">↺ 重置</button></header><main class="wrap"><section class="card"><canvas id="stage" width="760" height="500" aria-label="可拖动顶点的等积三角形画布"></canvas><div class="legend"><span><i class="dot" style="background:#4169e1"></i>三角形</span><span><i class="dot" style="background:#f2a33a"></i>可拖动顶点</span><span>两条蓝色直线互相平行</span></div></section><aside class="card"><h2>拖一拖，面积不变</h2><p class="hint">拖动橙色顶点 P，沿上方平行线左右滑动。底 AB 与高 h 都没有改变。</p><div class="formula">S = ½ × 底 × 高<br>S = ½ × <b id="base">420</b> × <b id="height">260</b><br><strong>= <span id="area">54600</span> 平方单位</strong></div><label class="switch"><input id="grid" type="checkbox" checked> 显示网格辅助线</label><button id="split" class="secondary" style="width:100%">▶ 播放细条割补</button><p class="hint" id="splitText">把三角形切成许多细条，每条平移后拼成同底同高的平行四边形一半。</p></aside></main><script>
const c=document.getElementById('stage'),x=c.getContext('2d');let P={x:380,y:110},drag=false,grid=true,anim=false,t=0;const A={x:170,y:370},B={x:590,y:370},topY=110,botY=370;
function fit(){const d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=760*d;c.height=500*d;x.setTransform(d,0,0,d,0,0);draw()}window.addEventListener('resize',fit);function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*760/r.width,y:(e.clientY-r.top)*500/r.height}}
c.addEventListener('pointerdown',e=>{let q=pos(e);if(Math.hypot(q.x-P.x,q.y-P.y)<28){drag=true;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(drag){P.x=Math.max(55,Math.min(705,pos(e).x));draw()}});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);document.getElementById('grid').onchange=e=>{grid=e.target.checked;draw()};document.getElementById('reset').onclick=()=>{P.x=380;anim=false;document.getElementById('split').textContent='▶ 播放细条割补';draw()};document.getElementById('split').onclick=()=>{anim=!anim;document.getElementById('split').textContent=anim?'Ⅱ 暂停细条割补':'▶ 播放细条割补';if(anim) requestAnimationFrame(loop)};
function loop(){if(!anim)return;t=(t+.012)%1;draw();requestAnimationFrame(loop)}function line(y,color){x.strokeStyle=color;x.lineWidth=2;x.setLineDash([9,7]);x.beginPath();x.moveTo(35,y);x.lineTo(725,y);x.stroke();x.setLineDash([]);x.fillStyle=color;x.font='bold 14px sans-serif';x.fillText(y===topY?'上平行线':'下平行线',45,y-10)}
function draw(){x.clearRect(0,0,760,500);const currentArea=Math.abs((A.x*(B.y-P.y)+B.x*(P.y-A.y)+P.x*(A.y-B.y))/2);if(grid){x.strokeStyle='#dfe6fa';x.lineWidth=1;for(let i=50;i<730;i+=35){x.beginPath();x.moveTo(i,45);x.lineTo(i,450);x.stroke()}for(let y=55;y<460;y+=35){x.beginPath();x.moveTo(25,y);x.lineTo(735,y);x.stroke()}}line(topY,'#7b61d9');line(botY,'#4169e1');x.fillStyle='#60708f';x.font='14px sans-serif';x.fillText('高 h = 260',35,245);x.strokeStyle='#21b89a';x.lineWidth=2;x.setLineDash([5,5]);x.beginPath();x.moveTo(P.x,P.y);x.lineTo(P.x,botY);x.stroke();x.setLineDash([]);x.fillStyle='#dce5ff';x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.lineTo(P.x,P.y);x.closePath();x.fill();x.strokeStyle='#4169e1';x.lineWidth=4;x.stroke();if(anim){for(let i=0;i<10;i++){let u=(i+.5)/10,sy=P.y+(botY-P.y)*u,half=(B.x-A.x)*(1-u)/2,shift=Math.sin((u+t)*Math.PI*2)*45;x.fillStyle='#f2a33a88';x.fillRect(P.x-half+shift,sy-4,half*2,8)}}for(const [q,label,color] of [[A,'A','#4169e1'],[B,'B','#4169e1'],[P,'P（拖动）','#f2a33a']]){x.fillStyle=color;x.beginPath();x.arc(q.x,q.y,10,0,7);x.fill();x.fillStyle='#17233d';x.font='bold 15px sans-serif';x.fillText(label,q.x+14,q.y+5)}document.getElementById('area').textContent=currentArea.toFixed(0);document.getElementById('base').textContent=Math.abs(B.x-A.x).toFixed(0);document.getElementById('height').textContent=Math.abs(B.y-P.y).toFixed(0)}fit();
</script></body></html>
