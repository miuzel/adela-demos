<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梯形蝴蝶模型｜面积关系</title><style>
:root{--ink:#17233d;--muted:#60708f;--primary:#4169e1;--accent:#7b61d9;--teal:#21b89a;--orange:#f2a33a;--bg:#f5f7ff;--surface:#fff;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{max-width:1100px;margin:auto;padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:clamp(22px,4vw,34px)}h1 small{display:block;color:var(--primary);font-size:13px;letter-spacing:2px;margin-bottom:6px}button{min-height:44px;border:0;border-radius:10px;padding:10px 16px;background:#e9edff;color:var(--primary);font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}.wrap{max-width:1100px;margin:auto;padding:12px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.card{background:var(--surface);padding:18px;border-radius:16px;box-shadow:0 18px 50px #2738731f}canvas{display:block;width:100%;height:auto;background:#fbfcff;border-radius:12px;touch-action:none}.hint{font-size:14px;color:var(--muted);line-height:1.6}.areas{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.area{padding:12px;border-radius:11px;font-weight:700}.area em{font-style:normal;display:block;font-size:13px;color:var(--muted)}.left{background:#d9f7ef;border-left:5px solid var(--teal)}.right{background:#e5eaff;border-left:5px solid var(--primary)}.top{background:#fff0d9;border-left:5px solid var(--orange)}.bottom{background:#eee7ff;border-left:5px solid var(--accent)}.eq{font-size:17px;line-height:1.9;background:#f0f4ff;padding:12px;border-radius:12px}.eq strong{color:var(--teal)}@media(max-width:760px){header{padding:18px 14px 10px}.wrap{grid-template-columns:1fr;padding:8px 12px 28px}.card{padding:13px}}
</style></head><body><header><h1><small>几何模型 · 02</small>梯形蝴蝶模型</h1><button id="reset">↺ 重置</button></header><main class="wrap"><section class="card"><canvas id="stage" width="760" height="520" aria-label="可拖动梯形四个顶点的蝴蝶模型"></canvas><p class="hint">拖动四个橙色顶点改变梯形。两条对角线交于 O，四片彩色三角形会即时更新面积。</p></section><aside class="card"><h2>四片翅膀的秘密</h2><div class="areas"><div class="area left"><em>S左</em><span id="sl">—</span></div><div class="area right"><em>S右</em><span id="sr">—</span></div><div class="area top"><em>S上</em><span id="st">—</span></div><div class="area bottom"><em>S下</em><span id="sb">—</span></div></div><div class="eq"><strong id="equal">S左 = S右 ✓</strong><br>S上 × S下 = S左 × S右<br><span id="product">—</span></div><p class="hint">面积单位为平方单位。等式成立的原因：两条对角线相交时，对顶三角形等高且共享角。</p></aside></main><script>
const c=document.getElementById('stage'),ctx=c.getContext('2d');let pts=[{x:170,y:150},{x:590,y:150},{x:500,y:390},{x:250,y:390}],drag=-1;const init=pts.map(p=>({...p}));function fit(){let d=devicePixelRatio||1;c.width=760*d;c.height=520*d;ctx.setTransform(d,0,0,d,0,0);draw()}window.addEventListener('resize',fit);function mouse(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*760/r.width,y:(e.clientY-r.top)*520/r.height}}c.addEventListener('pointerdown',e=>{let q=mouse(e);drag=pts.findIndex(p=>Math.hypot(p.x-q.x,p.y-q.y)<27);if(drag>=0)c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag>=0){let q=mouse(e);pts[drag].x=Math.max(45,Math.min(715,q.x));pts[drag].y=Math.max(55,Math.min(465,q.y));if(drag<2){pts[0].y=pts[1].y}else{pts[2].y=pts[3].y}draw()}});['pointerup','pointercancel'].forEach(n=>c.addEventListener(n,()=>drag=-1));document.getElementById('reset').onclick=()=>{pts=init.map(p=>({...p}));draw()};function area(a,b,c){return Math.abs((a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y))/2)}function intersect(a,b,c,d){let den=(a.x-b.x)*(c.y-d.y)-(a.y-b.y)*(c.x-d.x);let t=((a.x-c.x)*(c.y-d.y)-(a.y-c.y)*(c.x-d.x))/den;return{x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y)}}function poly(color,list){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(list[0].x,list[0].y);list.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}
function draw(){ctx.clearRect(0,0,760,520);ctx.strokeStyle='#e1e7f7';ctx.lineWidth=1;for(let x=40;x<740;x+=35){ctx.beginPath();ctx.moveTo(x,30);ctx.lineTo(x,490);ctx.stroke()}for(let y=35;y<500;y+=35){ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(740,y);ctx.stroke()}let [A,B,C,D]=pts,O=intersect(A,C,B,D);poly('#fff0d9',[A,B,O]);poly('#eee7ff',[O,C,D]);poly('#d9f7ef',[A,O,D]);poly('#e5eaff',[O,B,C]);ctx.setLineDash([7,6]);ctx.strokeStyle='#7b61d9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(C.x,C.y);ctx.moveTo(B.x,B.y);ctx.lineTo(D.x,D.y);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#4169e1';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.lineTo(C.x,C.y);ctx.lineTo(D.x,D.y);ctx.closePath();ctx.stroke();pts.forEach((p,i)=>{ctx.fillStyle='#f2a33a';ctx.beginPath();ctx.arc(p.x,p.y,11,0,7);ctx.fill();ctx.fillStyle='#17233d';ctx.font='bold 15px sans-serif';ctx.fillText(['A','B','C','D'][i],p.x+14,p.y+5)});ctx.fillStyle='#17233d';ctx.beginPath();ctx.arc(O.x,O.y,7,0,7);ctx.fill();ctx.fillText('O（交点）',O.x+12,O.y-9);let sL=area(A,O,D),sR=area(B,O,C),sT=area(A,B,O),sB=area(C,D,O);document.getElementById('sl').textContent=sL.toFixed(0);document.getElementById('sr').textContent=sR.toFixed(0);document.getElementById('st').textContent=sT.toFixed(0);document.getElementById('sb').textContent=sB.toFixed(0);document.getElementById('product').textContent=`${(sT*sB).toFixed(0)} = ${(sL*sR).toFixed(0)}（数值校验）`;document.getElementById('equal').textContent=Math.abs(sL-sR)<.5?'S左 = S右 ✓':'拖动后请观察面积关系'}fit();
</script></body></html>
