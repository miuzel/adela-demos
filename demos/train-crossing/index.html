<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火车过桥 · 行程问题</title><style>
:root{--ink:#17233d;--muted:#60708f;--blue:#4169e1;--violet:#7b61d9;--mint:#21b89a;--orange:#f2a33a;--bg:#f5f7ff;--card:#fff;--line:#e5e9f5;--shadow:0 18px 50px #2738731f;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 80% 0,#e8e7ff,transparent 35%),var(--bg);line-height:1.6}.wrap{width:min(1000px,calc(100% - 28px));margin:auto}header{padding:20px 0;display:flex;justify-content:space-between}header a{color:var(--muted);text-decoration:none}h1{font-size:clamp(25px,5vw,42px);line-height:1.2;margin:24px 0 4px}.lead{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.actions button{min-height:46px;padding:9px 17px;border:1px solid #cbd4f4;border-radius:12px;background:#fff;font:inherit;color:var(--ink);cursor:pointer}.tabs button[aria-selected=true],.primary{background:var(--blue)!important;border-color:var(--blue)!important;color:#fff!important}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,28px);box-shadow:var(--shadow);margin:18px 0}.panel{display:none}.panel.active{display:block}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}.control label{display:flex;justify-content:space-between;font-weight:700}.control output{color:var(--blue)}input{width:100%;accent-color:var(--blue);min-height:44px}.canvas-wrap{margin-top:18px;overflow:hidden;border-radius:15px;background:#eef1ff}.canvas-wrap canvas{display:block;width:100%;height:auto}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.fact{padding:10px;background:#f5f7ff;border-radius:13px;text-align:center}.fact b{display:block;color:var(--blue);font-size:19px}.formula{text-align:center;color:var(--violet);font-weight:800;font-size:clamp(17px,3vw,23px);margin:18px 0}.hint{color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:600px){.controls,.facts{grid-template-columns:1fr}.wrap{width:min(100% - 20px,1000px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap"><header><strong>🚆 行程问题 · 火车过桥</strong><a href="../../index.html">返回课件集</a></header><main><h1>一列火车，怎样算“通过”？</h1><p class="lead">“车头上桥”只是开始，车尾离开才算完整通过。用动画看清每一段路程。</p><nav class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="bridge">过桥 / 过隧道</button><button role="tab" aria-selected="false" data-tab="cars">双车错车与追及</button></nav><section id="bridge" class="card panel active" role="tabpanel"><div class="controls"><div class="control"><label for="length">车长 <output id="lengthOut">120 m</output></label><input id="length" type="range" min="60" max="200" value="120"></div><div class="control"><label for="bridgeLen">桥长 <output id="bridgeOut">180 m</output></label><input id="bridgeLen" type="range" min="80" max="300" value="180"></div><div class="control"><label for="trainSpeed">速度 <output id="speedOut">20 m/s</output></label><input id="trainSpeed" type="range" min="5" max="40" value="20"></div><div class="control"><label for="kind">场景 <output id="kindOut">桥</output></label><input id="kind" type="range" min="0" max="1" value="0"></div></div><div class="canvas-wrap"><canvas id="bridgeCanvas" width="900" height="320" aria-label="火车过桥全过程动画"></canvas></div><div class="facts"><div class="fact">当前节点 <b id="stage">车头上桥</b></div><div class="fact">已走路程 <b id="distance">0 m</b></div><div class="fact">总路程 <b id="total">300 m</b></div></div><p class="formula">火车通过桥（隧道）路程 = 车长 + 桥（隧道）长</p><p class="hint">三个节点：①车头上桥　②车身完全在桥上　③车尾离桥。长度与速度都带单位，时间 =（车长＋桥长）÷ 速度。</p><div class="actions"><button class="primary" id="play" type="button">▶ 播放</button><button id="reset" type="button">↺ 重置</button></div></section><section id="cars" class="card panel" role="tabpanel"><div class="controls"><div class="control"><label for="carA">甲车速度 <output id="aOut">18 km/h</output></label><input id="carA" type="range" min="5" max="35" value="18"></div><div class="control"><label for="carB">乙车速度 <output id="bOut">12 km/h</output></label><input id="carB" type="range" min="5" max="35" value="12"></div><div class="control"><label for="scenario">情形 <output id="scenarioOut">相向错车</output></label><input id="scenario" type="range" min="0" max="1" value="0"></div></div><div class="canvas-wrap"><canvas id="carsCanvas" width="900" height="300" aria-label="双车相向错车和同向追及动画"></canvas></div><div class="facts"><div class="fact">相对速度 <b id="relative">30 km/h</b></div><div class="fact">需要通过 <b>车长之和</b></div><div class="fact">方向 <b id="direction">相向</b></div></div><p class="formula">相向：v相对 = v甲 + v乙　｜　同向：v相对 = |v甲 − v乙|</p><p class="hint">相向错车要走过两车长度之和；同向追及要走过两车间距，再看谁更快。拖动情形滑块即可对比。</p><div class="actions"><button class="primary" id="carsPlay" type="button">▶ 播放</button><button id="carsReset" type="button">↺ 重置</button></div></section></main></div><script>
const $=s=>document.querySelector(s),bc=$('#bridgeCanvas'),bctx=bc.getContext('2d'),cc=$('#carsCanvas'),ctx=cc.getContext('2d');let playing=false,ct=0,last=0;
function line(c,x,y,x2,y2,col,w=3){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke()}function train(c,x,y,color,label){c.fillStyle=color;c.fillRect(x,y,150,38);c.fillStyle='#fff';c.fillRect(x+15,y+8,24,15);c.fillRect(x+50,y+8,24,15);c.fillStyle='#17233d';c.beginPath();c.moveTo(x+150,y);c.lineTo(x+168,y+19);c.lineTo(x+150,y+38);c.fill();c.fillText(label,x+62,y+62)}
function drawBridge(){let L=+$('#length').value,B=+$('#bridgeLen').value,V=+$('#trainSpeed').value, tunnel=+$('#kind').value, total=L+B, duration=total/V, p=Math.min(ct/duration,1), x=80+p*600, scale=160/L; bctx.clearRect(0,0,900,320);bctx.fillStyle='#eef1ff';bctx.fillRect(0,0,900,320);line(bctx,40,235,860,235,'#60708f',5);let start=390,end=start+B/L*160;bctx.fillStyle=tunnel?'#59627e':'#21b89a';bctx.fillRect(start,145,end-start,90);bctx.fillStyle='#fff';bctx.font='bold 15px system-ui';bctx.fillText(tunnel?'隧道':'桥',start+(end-start)/2-15,195);train(bctx,x-150,190,'#4169e1','火车');bctx.fillStyle='#17233d';bctx.font='14px system-ui';bctx.fillText('① 车头上'+(tunnel?'隧道':'桥'),start-35,120);bctx.fillText('② 车身完全在'+(tunnel?'隧道':'桥'),start+15,105);bctx.fillText('③ 车尾离开',end-25,120);let stage=p===0?'车头上'+(tunnel?'隧道':'桥'):p< L/total?'车头上'+(tunnel?'隧道':'桥'):p< B/total?'车身完全在'+(tunnel?'隧道':'桥'):'车尾离开';$('#stage').textContent=stage;$('#distance').textContent=Math.round(p*total)+' m';$('#total').textContent=total+' m';$('#lengthOut').textContent=L+' m';$('#bridgeOut').textContent=B+' m';$('#speedOut').textContent=V+' m/s';$('#kindOut').textContent=tunnel?'隧道':'桥'}
function drawCars(){let a=+$('#carA').value,b=+$('#carB').value,same=+$('#scenario').value,rel=same?Math.abs(a-b):a+b;ctx.clearRect(0,0,900,300);ctx.fillStyle='#eef1ff';ctx.fillRect(0,0,900,300);line(ctx,45,140,855,140,'#60708f',4);let q=Math.min(ct/5,1);let xa=same?100+q*340:100+q*330, xb=same?560+q*130:700-q*330;train(ctx,xa,100,'#4169e1','甲车');train(ctx,xb,100,'#e76886','乙车');ctx.fillStyle='#17233d';ctx.font='14px system-ui';ctx.fillText(same?'同向追及：甲车更快，逐渐接近':'相向错车：两车同时靠近',55,40);ctx.fillText('相对速度 = '+rel+' km/h',55,245);$('#aOut').textContent=a+' km/h';$('#bOut').textContent=b+' km/h';$('#relative').textContent=rel+' km/h';$('#direction').textContent=same?'同向':'相向';$('#scenarioOut').textContent=same?'同向追及':'相向错车'}
function frame(now){if(!last)last=now;let d=Math.min((now-last)/1000,.05);last=now;if(playing)ct+=d;drawBridge();drawCars();if(playing)requestAnimationFrame(frame)}
['length','bridgeLen','trainSpeed','kind','carA','carB','scenario'].forEach(id=>$('#'+id).addEventListener('input',()=>{drawBridge();drawCars()}));$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'Ⅱ 暂停':'▶ 播放';if(playing){last=0;requestAnimationFrame(frame)}};$('#reset').onclick=()=>{ct=0;playing=false;$('#play').textContent='▶ 播放';drawBridge()};$('#carsPlay').onclick=()=>{playing=!playing;$('#carsPlay').textContent=playing?'Ⅱ 暂停':'▶ 播放';if(playing){last=0;requestAnimationFrame(frame)}};$('#carsReset').onclick=()=>{ct=0;playing=false;$('#carsPlay').textContent='▶ 播放';drawCars()};document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));});drawBridge();drawCars();
</script></body></html>
